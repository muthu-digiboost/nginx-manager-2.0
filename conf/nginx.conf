# ==============================================================================
#  Main nginx configuration (committed). Machine-specific parts are generated:
#    conf/generated/upstreams.conf  PHP upstreams      (from data/settings.json)
#    conf/generated/env.conf        $projects_dir vars (from .env PROJECTS_DIR*)
#    conf/manager/manager.conf      manager UI vhost   (from .env MANAGER_*)
#    conf/sites/*.conf              one file per site  (managed from the UI)
#  nginx is always started with  -p <install folder>/  so every relative path
#  below resolves inside the install folder (no absolute paths anywhere).
# ==============================================================================

worker_processes  1;

error_log  logs/error.log;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server_names_hash_bucket_size  128;
    server_names_hash_max_size     1024;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent"';

    access_log  logs/access.log  main;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 100M;

    # --------------------------------------------------------------------------
    #  CORS headers for the SITES (kept from v1 - used by Requestly asset
    #  redirects). The manager vhost declares its own add_header lines, which
    #  stops these from being inherited there.
    # --------------------------------------------------------------------------
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PUT, DELETE" always;
    add_header Access-Control-Allow-Headers "Origin, X-Requested-With, Content-Type, Accept, Authorization" always;

    # --------------------------------------------------------------------------
    #  Default SSL certificate (generated by start-all.ps1 when missing).
    #  Sites with their own certificate override it in their server block.
    # --------------------------------------------------------------------------
    ssl_certificate      ../ssl/localhost/ssl.crt/server.crt;
    ssl_certificate_key  ../ssl/localhost/ssl.key/server.key;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  10m;

    # --------------------------------------------------------------------------
    #  Generated parts, the manager UI, then the sites.
    #  Disable a site by renaming it to *.conf.disabled (the UI does this).
    # --------------------------------------------------------------------------
    include generated/*.conf;
    include manager/*.conf;
    include sites/*.conf;
}
