#
# Every push to main (a direct commit or a merge): run all tests, then build and PUBLISH a new
# release of the desktop app - the app's Update button installs it:
#   1. tests  2. draft release v2.0.<run number>  3. Windows installer (+ latest.yml for the
#   updater) uploaded and the release PUBLISHED at once  4. the macOS dmg is added when ready.
# The installer bundle (desktop/scripts/bundle.js) contains only git-tracked files plus nginx
# and PHP from nginx.org / php.net (checksums verified) - never machine data.
# Builds are not code-signed (no certificates in the repo). Also as artifacts for 30 days.

name: Desktop app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write          # create and publish the release

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false   # never stop half-way through a release

jobs:
  test:
    name: Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, openssl

      - name: PHP tests
        run: php tests/run.php

      - name: PowerShell tests (Pester 3.4, built into Windows PowerShell 5.1)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'        # a blocked or broken run must fail the step
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          Import-Module Pester -RequiredVersion 3.4.0 -Force
          & .\tests\ps\run.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Desktop app tests
        working-directory: desktop
        run: |
          npm ci
          npm test

  release:
    name: Draft release
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        name: Version 2.0.<run number> (higher on every push, so the app sees an update)
        run: echo "version=2.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" --repo "${{ github.repository }}" \
            --draft --target "${{ github.sha }}" --title "Nginx Manager ${{ steps.v.outputs.version }}" \
            --notes "Built from ${{ github.sha }}. Windows: Nginx Manager Setup ${{ steps.v.outputs.version }}.exe - macOS: the .dmg. Installed apps update from Settings > Check for updates; sites, certificates and settings are kept."

  build-windows:
    name: Build (Windows) + publish
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build and upload to the draft release
        working-directory: desktop
        # bash with "stop on the first error": the default PowerShell once carried on after a
        # failed bundle step and published an installer without nginx/PHP.
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # no signing certificate: build unsigned
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          npm ci
          npm version "${{ needs.release.outputs.version }}" --no-git-tag-version
          node scripts/bundle.js
          npx electron-builder --win --publish always

      - name: Publish the release (installed apps see the update from now on)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.release.outputs.version }}" --repo "${{ github.repository }}" --draft=false --latest

      - uses: actions/upload-artifact@v4
        with:
          name: Nginx Manager - Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

  build-macos:
    # Runs next to the Windows build; GitHub's macOS machines can be queued for a while, so
    # the release does NOT wait for it - the dmg is added to the release when it is ready.
    name: Build (macOS) + add to release
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # no Apple certificate: build unsigned
        run: |
          set -euo pipefail
          npm ci
          npm version "${{ needs.release.outputs.version }}" --no-git-tag-version
          node scripts/bundle.js
          npx electron-builder --mac --publish never

      - name: Add the dmg to the release (also works after it was published)
        working-directory: desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.dmg dist/*.dmg.blockmap dist/latest-mac.yml)
          [ ${#files[@]} -gt 0 ] || { echo "no macOS build found"; exit 1; }
          gh release upload "v${{ needs.release.outputs.version }}" "${files[@]}" --repo "${{ github.repository }}" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: Nginx Manager - macOS
          path: desktop/dist/*.dmg
          if-no-files-found: error
          retention-days: 30
