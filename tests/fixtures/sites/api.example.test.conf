# ──────────────────────────────────────────────
#  api.example.test → PHP 8.3 (SSL enabled)
#  Framework: symfony | Project: $projects_dir/demo/api/public
# ──────────────────────────────────────────────
server {
    listen       443 ssl;
    server_name  api.example.test;

    ssl_certificate      ../ssl/api.example.test/ssl.crt/server.crt;
    ssl_certificate_key  ../ssl/api.example.test/ssl.key/server.key;

    root  $projects_dir/demo/api/public;
    index index.php index.html;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass   php83;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }

    error_log   logs/api.example.test-error.log;
    access_log  logs/api.example.test-access.log;
}

# HTTP → HTTPS redirect
server {
    listen      80;
    server_name api.example.test;
    return 301  https://$host$request_uri;
}
