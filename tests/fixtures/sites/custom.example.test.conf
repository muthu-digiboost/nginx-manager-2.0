# ──────────────────────────────────────────────
#  custom.example.test → PHP 8.5.12 (SSL enabled)
#  Framework: general | Project: $projects_dir/demo/custom
#  Hand-edited: rewrites generated from the project's .htaccess { see notes }
# ──────────────────────────────────────────────
server {
    listen       443 ssl;
    server_name  custom.example.test;

    ssl_certificate      ../ssl/custom.example.test/ssl.crt/server.crt;
    ssl_certificate_key  ../ssl/custom.example.test/ssl.key/server.key;

    root  $projects_dir/demo/custom;
    index index.php index.html;

    # .htaccess "deny from 64.145.93.0/24":
    deny 64.145.93.0/24;

    location / {
        # GENERATED rules live in the .inc file; a brace in a comment } must not confuse the parser {
        include sites/custom.example.test.rewrites.inc;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~* ^/(\.git|vendor)(/|$) {
        return 403;
    }

    location ~ \.php$ {
        try_files      $uri =404;
        fastcgi_pass   php8512;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  APP_NOTE "value with ; and { inside quotes }";
        include        fastcgi_params;
    }

    error_page 404 /index.php;

    error_log   logs/custom.example.test-error.log;
    access_log  logs/custom.example.test-access.log;
}

# HTTP → HTTPS redirect
server {
    listen      80;
    server_name custom.example.test;
    return 301  https://$host$request_uri;
}
