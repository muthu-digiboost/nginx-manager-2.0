[PHP]
; trimmed copy of a real php.ini (8.3) - extension section
memory_limit = 512M
;extension=bz2
extension=curl
;extension=ffi
extension=gd
;extension=intl
extension=mbstring
extension=exif      ; Must be after mbstring as it depends on it
;extension=oci8_19  ; Use with Oracle Database 19 Instant Client
extension=openssl
extension=php_sodium
;extension=sodium
zend_extension=opcache
;zend_extension=xdebug
